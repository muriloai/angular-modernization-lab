<header class="main-header">
  <div class="header-badge">Angular 22 - inject(DomSanitizer) com Signals e Zoneless</div>
  <h1>{{ title() }}</h1>
  <p class="description">
    Demonstrando segurança contra XSS, sanitização automática e <code>inject(DomSanitizer)</code> integrado de forma reativa a Signals em arquitetura Zoneless.
  </p>

  <div class="controls">
    <button (click)="toggleBypass()" class="btn" [class.btn-warn]="allowAuditBypass()" [class.btn-primary]="!allowAuditBypass()">
      Modo Auditoria Bypass: {{ allowAuditBypass() ? 'ATIVADO (Risco Monitorado)' : 'DESATIVADO (Seguro)' }}
    </button>
  </div>
</header>

<main class="reports-container">
  @for (report of reports(); track report.id) {
    <div class="report-wrapper">
      <app-report-viewer 
        [report]="report" 
        [allowBypass]="allowAuditBypass() && report.hasAuditApproval" />
    </div>
  }
</main>
