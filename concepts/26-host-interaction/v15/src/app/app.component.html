<div class="main-container">
  <header class="header">
    <div class="header-left">
      <span class="badge-version">Angular 15</span>
      <h1>{{ title }}</h1>
    </div>
  </header>

  <main class="content">
    <div class="card intro-card">
      <h2>Painel de Ação Rápida de Maquinários (Fazenda Santa Maria)</h2>
      <p class="subtitle">
        Demonstração clássica com decorators <code>@HostBinding</code> para classes/estilos e <code>@HostListener</code> para eventos no hospedeiro.
      </p>

      <div class="selection-summary">
        <span>Maquinários Selecionados no Painel:</span>
        <strong>{{ selecionadas.length }} de {{ maquinas.length }}</strong>
      </div>
    </div>

    <div class="machines-grid">
      <app-machine-action-card
        *ngFor="let m of maquinas"
        [machine]="m"
        (statusAlternado)="alternarSelecao($event)"
      >
      </app-machine-action-card>
    </div>
  </main>
</div>
