<header class="main-header">
  <div class="header-badge">Angular 22 - APIs Funcionais, Objeto Host e Zoneless</div>
  <h1>{{ title() }}</h1>
  <p class="description">
    Demonstrando a substituição integral de decorators por <code>input.required()</code>, <code>output()</code>, <code>viewChild()</code>, <code>inject()</code> e configuração declarativa <code>host</code>.
  </p>
</header>

<main>
  <div class="pivots-grid">
    @for (pivot of pivots(); track pivot.id) {
      <app-pivot-panel 
        [pivot]="pivot"
        (pressureChanged)="onPressureChange($event)"
        (statusToggled)="onTogglePower($event)" />
    }
  </div>
</main>
